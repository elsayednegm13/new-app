<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negm Lodaing</title>
  <style>
    :root,
    [data-theme="light"] {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #64748b;
      --border-subtle: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #3653d9;
      --primary-hover: #2b44b8;
      --primary-fg: #ffffff;
      --teal: #0e6f8c;
      --teal-hover: #0b5a73;
      --teal-fg: #ffffff;
      --soft-bg: #eef2f8;
      --soft-hover: #e2e8f0;
      --ring: #2563eb;
      --ok-bg: #d1fae5;
      --ok-fg: #065f46;
      --ok-border: #6ee7b7;
      --err-bg: #fee2e2;
      --err-fg: #991b1b;
      --err-border: #fca5a5;
      --warn-bg: #fef3c7;
      --warn-fg: #92400e;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    [data-theme="dark"] {
      --bg: #0b0e17;
      --surface: #161b2e;
      --surface-alt: #1c233b;
      --border: #7889ad;
      --border-subtle: #252f4d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-fg: #ffffff;
      --teal: #0e7490;
      --teal-hover: #0b5d7a;
      --teal-fg: #ffffff;
      --soft-bg: #1c233b;
      --soft-hover: #252f4d;
      --ring: #60a5fa;
      --ok-bg: #0b2e22;
      --ok-fg: #34d399;
      --ok-border: #065f46;
      --err-bg: #3a1416;
      --err-fg: #fca5a5;
      --err-border: #7f1d1d;
      --warn-bg: #36260a;
      --warn-fg: #fbbf24;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-family: "Segoe UI", system-ui, -apple-system, Tahoma, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      background-color: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100%;
      background-color: var(--bg);
      color: var(--text);
      padding-block: 12px;
      padding-inline: 12px;
      overflow-x: hidden;
    }

    /* Extension popup native sizing vs standalone responsive tab */
    @media (max-width: 440px) {
      .shell {
        width: 100%;
      }
    }

    @media (min-width: 441px) {
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding-block: 24px;
        padding-inline: 20px;
      }
      .shell {
        width: 100%;
        max-width: 420px;
        background-color: var(--surface);
        border: 1px solid var(--border-subtle);
        border-radius: calc(var(--radius-lg) + 4px);
        padding-block: 18px;
        padding-inline: 18px;
        box-shadow: var(--shadow);
      }
    }

    /* Popup default width hint when opened from Chrome toolbar */
    html[data-popup="1"] body {
      width: 348px;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-block-end: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      flex-shrink: 0;
    }

    .brand-txt {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .brand-port {
      font-size: 0.69rem;
      color: var(--text-muted);
      font-family: Consolas, "Courier New", monospace;
    }

    .head-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding-inline: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background-color: var(--soft-bg);
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s ease;
    }

    .icon-btn:hover {
      background-color: var(--soft-hover);
      border-color: var(--border);
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.14);
    }

    .icon-btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: none;
    }

    .theme-icon {
      width: 17px;
      height: 17px;
      display: block;
      pointer-events: none;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-block: 8px;
      padding-inline: 11px;
      border-radius: var(--radius-md);
      background-color: var(--surface);
      border: 1px solid var(--border-subtle);
      margin-block-end: 10px;
    }

    @media (min-width: 441px) {
      .status-bar,
      .card {
        background-color: var(--surface-alt);
      }
    }

    .status-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.73rem;
      font-weight: 700;
      padding-block: 3px;
      padding-inline: 10px;
      border-radius: 999px;
      background-color: var(--err-bg);
      color: var(--err-fg);
      border: 1px solid var(--err-border);
      white-space: nowrap;
    }

    .pill.online {
      background-color: var(--ok-bg);
      color: var(--ok-fg);
      border-color: var(--ok-border);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.22);
    }

    .pill.online .pill-dot {
      animation: pulse-pill-dot 2.2s infinite ease-in-out;
    }

    @keyframes pulse-pill-dot {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 3px currentColor); }
      50% { opacity: 0.55; transform: scale(0.85); filter: none; }
    }

    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
      flex-shrink: 0;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding-block: 11px;
      padding-inline: 12px;
      margin-block-end: 12px;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      min-height: 44px;
    }

    .switch-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: start;
    }

    .switch-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
    }

    .switch-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .chk-input {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      padding-block: 9px;
      padding-inline: 14px;
      font-size: 0.81rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.12s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.18s ease;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }

    .btn:hover:not(:disabled) svg {
      transform: scale(1.08);
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-fg);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(79, 70, 229, 0.38);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 1px 4px rgba(79, 70, 229, 0.2);
    }

    .btn-teal {
      background-color: var(--teal);
      color: var(--teal-fg);
      box-shadow: 0 2px 8px rgba(14, 116, 144, 0.25);
    }

    .btn-teal:hover:not(:disabled) {
      background-color: var(--teal-hover);
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(14, 116, 144, 0.38);
    }

    .btn-teal:active:not(:disabled) {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 1px 4px rgba(14, 116, 144, 0.2);
    }

    .btn-soft {
      background-color: var(--soft-bg);
      color: var(--text);
      border-color: var(--border-subtle);
    }

    .btn-soft:hover:not(:disabled) {
      background-color: var(--soft-hover);
      border-color: var(--border);
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }

    .btn-soft:active:not(:disabled) {
      transform: translateY(1px) scale(0.99);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.58;
      cursor: not-allowed;
    }

    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .msg {
      margin-block-start: 10px;
      min-height: 22px;
      padding-block: 4px;
      padding-inline: 8px;
      border-radius: var(--radius-sm);
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }

    .msg[data-state="ok"] {
      background-color: var(--ok-bg);
      color: var(--ok-fg);
    }

    .msg[data-state="err"] {
      background-color: var(--err-bg);
      color: var(--err-fg);
    }

    /* Circular Reveal View Transitions (Telegram Style) */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) {
      z-index: 1;
    }
    ::view-transition-new(root) {
      z-index: 9999;
      animation: circular-reveal 450ms cubic-bezier(0, 0, 0.2, 1);
    }
    @keyframes circular-reveal {
      from {
        clip-path: circle(0px at var(--reveal-x, 50%) var(--reveal-y, 50%));
      }
      to {
        clip-path: circle(var(--reveal-r, 150%) at var(--reveal-x, 50%) var(--reveal-y, 50%));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
      ::view-transition-group(*),
      ::view-transition-old(*),
      ::view-transition-new(*) {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="head">
      <div class="brand">
        <img class="brand-logo" src="icons/icon48.png" alt="">
        <div class="brand-txt">
          <span class="brand-title" id="lblBrand">Negm Lodaing</span>
          <code class="brand-port" dir="ltr">127.0.0.1:45791</code>
        </div>
      </div>
      <div class="head-controls">
        <button type="button" id="btnLang" class="icon-btn" aria-label="Switch language">EN</button>
        <button type="button" id="btnTheme" class="icon-btn" aria-label="Toggle theme">
          <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="status-bar" aria-labelledby="lblConnTitle">
        <span class="status-label" id="lblConnTitle">حالة الاتصال</span>
        <span id="statusPill" class="pill" role="status" aria-live="polite">
          <span class="pill-dot" aria-hidden="true"></span>
          <span id="statusText">جاري الفحص...</span>
        </span>
      </section>

      <section class="card">
        <label class="switch-row" for="chkAuto">
          <span class="switch-text">
            <span class="switch-title" id="lblAutoTitle">الالتقاط التلقائي للتنزيلات</span>
            <span class="switch-sub" id="lblAutoSub">اعتراض الروابط المباشرة وتمرير الكوكيز</span>
          </span>
          <input type="checkbox" id="chkAuto" class="chk-input" role="switch" checked>
        </label>
      </section>

      <div class="actions">
        <button type="button" id="btnVideo" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="3"></rect>
            <polygon points="10 9 15 12 10 15 10 9" fill="currentColor"></polygon>
          </svg>
          <span id="lblBtnVideo">تحميل فيديو هذه الصفحة</span>
        </button>

        <button type="button" id="btnSpider" class="btn btn-teal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3.6 9h16.8M3.6 15h16.8M12 3a14.5 14.5 0 0 0 0 18M12 3a14.5 14.5 0 0 1 0 18"></path>
          </svg>
          <span id="lblBtnSpider">استخراج كل روابط وملفات الصفحة</span>
        </button>

        <button type="button" id="btnDialog" class="btn btn-soft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          <span id="lblBtnDialog">إضافة رابط الصفحة يدويًا</span>
        </button>
      </div>

      <div id="msgBox" class="msg" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
